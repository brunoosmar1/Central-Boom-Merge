<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Controle de Consignado — Boom Algodão Doce</title>
    <meta name="description" content="Sistema de gestão de consignação, prospecção e roteiro para a Boom Algodão Doce." />
    <meta name="theme-color" content="#2A78D6" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html { -webkit-text-size-adjust: 100%; }
      html, body { margin: 0; overscroll-behavior-y: contain; overflow-x: hidden; }
      button, input, a { touch-action: manipulation; }
      button:active { transform: scale(0.97); }
      button, input, select, textarea, a { transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
        outline: 2px solid #2A78D6; outline-offset: 2px;
      }
      .search-pill:focus-within { box-shadow: 0 0 0 2px #2A78D6; border-color: transparent !important; }
    </style>
